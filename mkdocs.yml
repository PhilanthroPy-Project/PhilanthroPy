site_name: PhilanthroPy
site_description: A scikit-learn compatible toolkit for predictive donor analytics.
site_url: https://PhilanthroPy-Project.github.io/PhilanthroPy/
repo_url: https://github.com/PhilanthroPy-Project/PhilanthroPy
repo_name: PhilanthroPy-Project/PhilanthroPy
edit_uri: edit/main/docs/
copyright: MIT licensed. Built by the PhilanthroPy contributors.

theme:
  name: material
  custom_dir: overrides
  favicon: assets/logo.svg
  font: false
  icon:
    logo: philanthropy/heart-rise
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PhilanthroPy-Project/PhilanthroPy
      name: PhilanthroPy on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/philanthropy/
      name: PhilanthroPy on PyPI

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            members_order: source

nav:
  - Home: index.md
  - Tutorials:
    - tutorials/index.md
    - tutorials/building_your_first_model.md
    - tutorials/avoiding_temporal_data_leakage.md
    - tutorials/building_a_grateful_patient_pipeline.md
  - How-To Guides:
    - how-to/index.md
    - how-to/use_the_cli.md
    - how-to/ingest_unischema_events.md
    - how-to/ingest_civicrm_contributions.md
    - how-to/handle_missing_wealth_data.md
    - how-to/build_grateful_patient_features.md
    - how-to/recommend_ask_amounts.md
    - how-to/score_matching_gift_eligibility.md
    - how-to/measure_campaign_efficiency.md
    - how-to/audit_score_fairness.md
    - how-to/estimate_appeal_uplift.md
    - how-to/save_and_load_models.md
    - how-to/develop_and_test.md
  - Explanation:
    - explanation/index.md
    - explanation/fundraising_metrics.md
    - explanation/capacity_and_loyalty.md
    - explanation/design_principles.md
    - explanation/compliance_considerations.md
    - explanation/security_review_answers.md
    - explanation/comparison_to_vendors.md
    - explanation/benchmarks.md
  - Contributing: contributing.md
  - API Reference:
    - reference/index.md
    - reference/preprocessing.md
    - reference/models.md
    - reference/metrics.md
    - reference/inspection.md
    - reference/datasets.md
    - reference/model_selection.md
    - reference/ingest.md
    - reference/visualisation.md
    - reference/utils.md
    - reference/experimental.md
    - reference/cli.md
