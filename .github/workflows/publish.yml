name: Publish to PyPI

# Trusted Publishing (OIDC): no API token is stored anywhere.
# Fires ONLY when a GitHub Release is *published* (from a v*.*.* tag), so
# pushing a tag alone never publishes: you keep a manual gate by clicking
# "Publish release" in the GitHub UI.
#
# One-time PyPI setup (done in the pypi.org project settings, not here):
#   Publishing -> Add a new pending publisher:
#     Owner:        PhilanthroPy-Project
#     Repository:   PhilanthroPy
#     Workflow:     publish.yml
#     Environment:  pypi
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      # Every action in this workflow is SHA-pinned, not just the publish step:
      # this job builds the exact files the id-token step uploads to PyPI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"
      - name: Tag, version and changelog must agree
        # The tag reaches the shell through env, never interpolated into the
        # script text, so a crafted tag name cannot inject commands.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$V" = "$TAG" ] || { echo "tag != pyproject $V"; exit 1; }
          grep -qE "^## \[$V\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "CHANGELOG.md needs a dated '## [$V] - YYYY-MM-DD' heading."
            echo "Found:"; grep -n "^## \[$V\]" CHANGELOG.md || echo "  (no section at all)"
            echo "A release prepared ahead of time carries '- TBD'; set the real date first."
            exit 1
          }
      - name: Install build backend
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
      - name: Verify metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/philanthropy
    permissions:
      id-token: write   # REQUIRED for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      # SHA-pinned: this step runs with id-token: write against the `pypi`
      # environment, so a mutable tag here is a supply-chain hole.
      # Dependabot's github-actions ecosystem keeps the pin current.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
