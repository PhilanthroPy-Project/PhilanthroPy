[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "philanthropy"
version = "0.7.0"
description = "scikit-learn-native predictive analytics for nonprofit and academic-medical-center fundraising: donor propensity, lapse, planned giving, wealth screening, and revenue forecasting."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shivam Lalakiya", email = "shivamlalakiya151299@gmail.com" }
]
keywords = [
    "nonprofit",
    "fundraising",
    "scikit-learn",
    "donor-analytics",
    "healthcare-philanthropy",
    "machine-learning",
    "predictive-analytics",
    "data-science",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "scikit-learn>=1.6",
    "pandas>=2.0",
    "numpy>=1.23",
    "joblib>=1.2"
]

[project.optional-dependencies]
# matplotlib 3.5.x crashes inside seaborn's KDE path against pandas 2.0
# (cbook._check_1d does `x[:, None]` on a pandas Index); seaborn < 0.12.2 reads
# the removed `mode.use_inf_as_null` option. Both floors are load-bearing.
viz = [
    "matplotlib>=3.6",
    "seaborn>=0.13"
]
# Floors here are load-bearing: the `floors` CI job installs with
# `uv pip install --resolution lowest-direct`, so an unpinned tool resolves to
# its oldest release on PyPI (pytest 2.0.0) and the job never gets to run.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.70",
    "flake8>=6.0",
    "mypy>=1.0",
    "matplotlib>=3.6",
    "seaborn>=0.13"
]
docs = [
    "mkdocs>=1.4.0,<2",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]",
    "matplotlib",
    "pandas",
    "scikit-learn"
]

[project.scripts]
philanthropy = "philanthropy.cli:main"

[project.urls]
Homepage = "https://github.com/PhilanthroPy-Project/PhilanthroPy"
Documentation = "https://PhilanthroPy-Project.github.io/PhilanthroPy/"
Repository = "https://github.com/PhilanthroPy-Project/PhilanthroPy"
Changelog = "https://github.com/PhilanthroPy-Project/PhilanthroPy/blob/main/CHANGELOG.md"
Issues = "https://github.com/PhilanthroPy-Project/PhilanthroPy/issues"
UniSchema = "https://github.com/PhilanthroPy-Project/UniSchema"

[tool.setuptools.packages.find]
where = ["."]
include = ["philanthropy", "philanthropy.*"]

[tool.setuptools.package-data]
"philanthropy" = ["py.typed"]
"philanthropy.datasets" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
files = ["philanthropy"]
ignore_missing_imports = true

# Ratchet, not a wish. `disallow_untyped_defs` is switched on one subpackage at
# a time as its functions get annotated, so a newly-added unannotated function
# in a listed subpackage fails CI instead of quietly enlarging the backlog.
# Add a module to this list in the same PR that annotates it; when every
# subpackage is listed, delete the override and set the flag at the top level.
#
# Still to do (count at the time of writing): model_selection 4 (open PR),
# experimental 5 (open PR), models 58, preprocessing 66. Tracked in #166.
[[tool.mypy.overrides]]
module = [
    "philanthropy.cli",
    "philanthropy.datasets.*",
    "philanthropy.inspection.*",
    "philanthropy.metrics.*",
    "philanthropy.utils.*",
    "philanthropy.visualisation.*",
]
disallow_untyped_defs = true

[tool.coverage.run]
source = ["philanthropy"]
branch = true

[tool.coverage.report]
# Measured 95% branch on the first green run; pinned one point under so the
# gate catches a regression without failing on rounding. 85 had nine points of
# slack and would not have noticed ~170 statements of tested code being deleted.
fail_under = 92
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
