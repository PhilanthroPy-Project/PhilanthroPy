name: Draft PDF

on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  pull_request:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Build JOSS paper draft
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SHA-pinned: upstream publishes no tags, so `@master` is a mutable
      # third-party branch. Dependabot keeps this pin current.
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c  # master @ 2026-08-01
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload paper.pdf
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
